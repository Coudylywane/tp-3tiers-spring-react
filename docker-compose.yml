services:
  db:
    image: postgres:15
    container_name: tp_db
    environment:
      POSTGRES_USER: tpuser
      POSTGRES_PASSWORD: tppass
      POSTGRES_DB: tpdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: tp_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tpdb
      SPRING_DATASOURCE_USERNAME: tpuser
      SPRING_DATASOURCE_PASSWORD: tppass
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: tp_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
